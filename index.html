<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0d0d1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; }
        canvas { border: 2px solid #00ffff; box-shadow: 0 0 20px #00ffff; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Level: <span id="level">1</span> | Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let player = { x: 180, y: 550, w: 40, h: 20, speed: 7, color: '#00ffff' };
        let obstacles = [];
        let keys = { ArrowLeft: false, ArrowRight: false };
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameOver = false;

        // Level Configurations
        const levels = {
            1: { speed: 3, spawnRate: 60, color: '#ff00ff' }, // Slow
            2: { speed: 4, spawnRate: 45, color: '#ffff00' }, // Medium
            3: { speed: 5, spawnRate: 30, color: '#ff0000' }, // Fast
            4: { speed: 6.5, spawnRate: 20, color: '#00ff00' } // Insane
        };

        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        function spawnObstacle() {
            const config = levels[level] || levels[4];
            const size = Math.random() * 30 + 20;
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                w: size,
                h: size,
                speed: config.speed,
                color: config.color
            });
        }

        function update() {
            if (gameOver) return;

            // Player Movement
            if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
            if (keys.ArrowRight && player.x < canvas.width - player.w) player.x += player.speed;

            // Spawn Obstacles
            const config = levels[level] || levels[4];
            if (Math.random() * 100 < config.spawnRate) spawnObstacle();

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += o.speed;

                // Collision Detection
                if (o.x < player.x + player.w && o.x + o.w > player.x && o.y < player.y + player.h && o.y + o.h > player.y) {
                    obstacles.splice(i, 1);
                    lives--;
                    if (lives <= 0) gameOver = true;
                    continue;
                }

                // Remove off-screen & add score
                if (o.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    
                    // Level up every 100 points
                    if (score >= level * 100 && level < 4) {
                        level++;
                    }
                }
            }

            document.getElementById('level').innerText = level;
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Draw Obstacles
            obstacles.forEach(o => {
                ctx.fillStyle = o.color;
                ctx.shadowColor = o.color;
                ctx.fillRect(o.x, o.y, o.w, o.h);
            });

            // Reset Shadow
            ctx.shadowBlur = 0;

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.font = '20px Arial';
                ctx.fillText('Refresh to restart', canvas.width/2, canvas.height/2 + 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver) requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
